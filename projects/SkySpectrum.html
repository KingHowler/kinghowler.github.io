<h1 id="3d-models-of-pcbs">3D Models of PCBs</h1>
<h3 id="rc-transmitter">RC Transmitter</h3>

<div id="Transmitter" style="width:100%; height:500px;"></div>

<script>
  (function () {
    // Scene, Camera, Renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    const viewerContainer = document.getElementById('Transmitter');
    renderer.setSize(viewerContainer.clientWidth, viewerContainer.clientHeight);
    viewerContainer.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0x404040, 2);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(1, 1, 1).normalize();
    scene.add(directionalLight);

    // Load MTL file
    const mtlLoader = new THREE.MTLLoader();
    mtlLoader.load(
      'https://raw.githubusercontent.com/MUmarShahbaz/RC-Transmitter-and-Receiver/refs/heads/main/PCBs/RC%20Transmitter/3D%20Model/RC%20Transmitter.mtl',
      (materials) => {
        materials.preload();

        // Load OBJ file with MTL materials
        const objLoader = new THREE.OBJLoader();
        objLoader.setMaterials(materials);
        objLoader.load(
          'https://raw.githubusercontent.com/MUmarShahbaz/RC-Transmitter-and-Receiver/refs/heads/main/PCBs/RC%20Transmitter/3D%20Model/RC%20Transmitter.obj',
          (object) => {
            // Calculate the bounding box of the object
            const boundingBox = new THREE.Box3().setFromObject(object);
            const size = new THREE.Vector3();
            boundingBox.getSize(size); // Get the size of the bounding box
            const objectCenter = new THREE.Vector3();
            boundingBox.getCenter(objectCenter);
            const maxDim = Math.max(size.x, size.y); // Find the maximum dimension
            
            const aspectRatio = viewerContainer.clientWidth / viewerContainer.clientHeight;
            object.position.set(-size.x/2, -size.y/2, 0);
            object.updateMatrixWorld();

            // Add the object to the scene
            scene.add(object);

            // Adjust the camera to fit the scaled object
            const cameraDistance = (1.3*size.y) / (Math.tan((Math.PI/180) * camera.fov));
            camera.position.set(0, 0, cameraDistance); // Set camera.position.y to 0
            camera.up.set(0, -1, 0);
            camera.lookAt(objectCenter);

            // Update the camera's FOV
            camera.fov = calculateFOV(size.y, cameraDistance, aspectRatio);
            camera.near = 0.1;  // Keep the near clipping plane close to avoid clipping near objects
            camera.far = 10000; // Increase the far plane to account for large objects
            camera.updateProjectionMatrix();

            controls.update(); // Update the controls
          },
          (xhr) => {
            console.log((xhr.loaded / xhr.total) * 100 + '% loaded');
          },
          (error) => {
            console.error('Error loading OBJ file:', error);
          }
        );
      },
      (xhr) => {
        console.log((xhr.loaded / xhr.total) * 100 + '% loaded');
      },
      (error) => {
        console.error('Error loading MTL file:', error);
      }
    );

    // Function to calculate FOV
    function calculateFOV(objectHeight, cameraDistance, aspectRatio) {
      const heightFOV = 2 * Math.atan((objectHeight / 2) / cameraDistance) * (180 / Math.PI);
      const widthFOV = heightFOV * aspectRatio;
      return Math.max(heightFOV, widthFOV); // Use the larger FOV
    }

    // Add OrbitControls for pan, zoom, and rotate
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; // Add smooth damping (inertia)
    controls.dampingFactor = 0.05; // Adjust damping strength
    controls.screenSpacePanning = true; // Allow panning in screen space
    controls.minDistance = 5; // Minimum zoom distance
    controls.maxDistance = 1000; // Maximum zoom distance

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update(); // Required if damping is enabled
      renderer.render(scene, camera);
    }
    animate();

    // Handle window resize
    window.addEventListener('resize', () => {
      const width = viewerContainer.clientWidth;
      const height = viewerContainer.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });
  })();
</script>
